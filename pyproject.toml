[project]
name="autter-demo-python-worker"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.8.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx2>=2.13.1",
]
[tool.pytest.ini_options]
pythonpath=["."]
[tool.setuptools]
packages=["worker"]
